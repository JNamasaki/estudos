<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlists de Estudo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
      color: #222;
    }

    header {
      background: #1f2937;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      max-width: 800px;
      margin: auto;
    }

    .playlist {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 1rem;
      width: 100%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .playlist:hover {
      transform: scale(1.02);
    }

    .player {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      width: 100%;
      margin-top: 1rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1e40af;
    }

    .voltar {
      background: #6b7280;
    }

    .voltar:hover {
      background: #4b5563;
    }

    iframe, video {
      width: 100%;
      min-height: 400px;
      max-height: 100%;
      border-radius: 8px;
      border: none;
    }

    @media (max-width: 600px) {
      iframe, video {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 Playlists de Estudo</h1>
  </header>

  <main id="app">
    <div id="listaPlaylists"></div>
    <div id="playerContainer" class="player" style="display:none;">
      <h2 id="tituloAula"></h2>
      <div id="conteudo"></div>
      <div class="controls">
        <button id="btnAnterior">⬅ Anterior</button>
        <button class="voltar" id="btnVoltar">🔙 Voltar</button>
        <button id="btnProximo">Próximo ➡</button>
      </div>
    </div>
  </main>

  <script>
    let playlists = [];
    let playlistAtual = null;
    let indiceAtual = 0;

    async function carregarPlaylists() {
      const res = await fetch("playlists.json");
      playlists = await res.json();
      exibirPlaylists();
    }

    function exibirPlaylists() {
      const lista = document.getElementById("listaPlaylists");
      lista.innerHTML = "";

      playlists.forEach(p => {
        const div = document.createElement("div");
        div.className = "playlist";
        div.innerHTML = `
          <h2>${p.titulo}</h2>
          <p>${p.descricao}</p>
          <small>${p.itens.length} itens</small>
        `;
        div.onclick = () => abrirPlaylist(p);
        lista.appendChild(div);
      });
    }

    function abrirPlaylist(playlist) {
      playlistAtual = playlist;
      indiceAtual = Number(localStorage.getItem(`progresso_${playlist.id}`)) || 0;
      document.getElementById("listaPlaylists").style.display = "none";
      document.getElementById("playerContainer").style.display = "block";
      carregarItem();
    }

    function carregarItem() {
      const item = playlistAtual.itens[indiceAtual];
      document.getElementById("tituloAula").innerText = `${item.titulo}`;

      const conteudo = document.getElementById("conteudo");
      conteudo.innerHTML = "";

      let elemento;
      if (item.tipo === "video") {
        elemento = document.createElement("video");
        elemento.src = item.arquivo;
        elemento.controls = true;
      } else if (item.tipo === "pdf") {
        elemento = document.createElement("iframe");
        elemento.src = item.arquivo;
      } else if (item.tipo === "html") {
        elemento = document.createElement("iframe");
        elemento.src = item.arquivo;
      } else {
        elemento = document.createElement("p");
        elemento.textContent = "Tipo não suportado.";
      }

      conteudo.appendChild(elemento);
      localStorage.setItem(`progresso_${playlistAtual.id}`, indiceAtual);
    }

    document.getElementById("btnAnterior").onclick = () => {
      if (indiceAtual > 0) {
        indiceAtual--;
        carregarItem();
      }
    };

    document.getElementById("btnProximo").onclick = () => {
      if (indiceAtual < playlistAtual.itens.length - 1) {
        indiceAtual++;
        carregarItem();
      }
    };

    document.getElementById("btnVoltar").onclick = () => {
      document.getElementById("playerContainer").style.display = "none";
      document.getElementById("listaPlaylists").style.display = "block";
    };

    carregarPlaylists();
  </script>
</body>
</html>
